version: 2
updates:
  # Minor and patch crate bumps share one pull request. Each one compiles
  # Marian, and a separate request per crate would queue the runners.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # The rust image tag in the Dockerfile should stay on the same release as
  # rust-toolchain.toml. Dependabot does not edit that file.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
