name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marian
          POSTGRES_PASSWORD: marian
          POSTGRES_DB: marian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marian -d marian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://marian:marian@127.0.0.1:5432/marian
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  binary:
    name: Release binary
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The @ref is the toolchain this action installs. It has to match
      # rust-toolchain.toml, or the musl target lands on a compiler cargo does not use.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config file
          sudo cp ci/musl-cc /usr/local/bin/musl-cc
          sudo chmod +x /usr/local/bin/musl-cc
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-release
      - name: Build static binary
        env:
          MARIAN_VERSION: ${{ steps.version.outputs.version }}
          CC_x86_64_unknown_linux_musl: /usr/local/bin/musl-cc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl --features static-libpq
          cp target/x86_64-unknown-linux-musl/release/marian marian
          file marian | grep -Eq "statically linked|static-pie linked"
      - uses: actions/upload-artifact@v7
        with:
          name: marian
          path: marian
          if-no-files-found: error

  release:
    name: Image and chart
    if: github.event_name == 'push'
    needs: [test, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: marian
          path: .
      - name: Image name
        id: image
        run: |
          chmod +x marian
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.image
          platforms: linux/amd64
          provenance: false
          sbom: false
          # GHCR serves this manifest as OCI. Runtimes that only ask for Docker
          # media types get MANIFEST_UNKNOWN, which kubelet reports as not found.
          outputs: type=image,push=true,oci-mediatypes=false
          build-args: MARIAN_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
      - uses: azure/setup-helm@v4
        if: startsWith(github.ref, 'refs/tags/')
      - name: Publish chart
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("deploy/marian/values.yaml")
          text = path.read_text()
          text = text.replace("repository: marian", f"repository: {os.environ['IMAGE']}", 1)
          text = text.replace('tag: "0.6.2"', f'tag: "{os.environ["IMAGE_TAG"]}"', 1)
          path.write_text(text)
          PY
          helm package deploy/marian --version "$version" --app-version "$version"
          owner="${GITHUB_REPOSITORY%%/*}"
          helm push "marian-${version}.tgz" "oci://ghcr.io/${owner,,}/charts"
