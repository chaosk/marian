name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  # Pull requests aren't a trigger: a branch here is tested by its push run.
  # A skipped pull request run named Test would pass main's required Test
  # check before the push run finished. Pull requests from forks get no run.
  # The tag workflow starts this for the tag it creates, because a tag pushed
  # with the workflow token doesn't start a push run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marian
          POSTGRES_PASSWORD: marian
          POSTGRES_DB: marian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marian -d marian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://marian:marian@127.0.0.1:5432/marian
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      # The server depends on the app with `ssr`, so this runs the app's tests too.
      - run: cargo test --locked --workspace --exclude marian-frontend

  binary:
    name: Release binary
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The @ref is the toolchain this action installs. It has to match
      # rust-toolchain.toml, or the musl target lands on a compiler cargo does not use.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
      - name: musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config file
          sudo cp ci/musl-cc /usr/local/bin/musl-cc
          sudo chmod +x /usr/local/bin/musl-cc
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-release
      # The release binary, checked against a pinned hash. Building it from
      # source took minutes and ran the runner out of disk.
      - name: cargo-leptos
        env:
          VERSION: 0.3.11
          SHA256: 1c9cf0e1e3ffae6c8b58d29281d949dab560cea613b80d361f323f93071df7c8
        run: |
          name=cargo-leptos-x86_64-unknown-linux-gnu
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/leptos-rs/cargo-leptos/releases/download/v$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/$name/cargo-leptos" "$HOME/.cargo/bin/cargo-leptos"
          cargo leptos --version
      - name: Build static binary
        env:
          MARIAN_VERSION: ${{ steps.version.outputs.version }}
          CC_x86_64_unknown_linux_musl: /usr/local/bin/musl-cc
          # cargo-leptos takes the server's target from here; it has no flag for it.
          LEPTOS_BIN_TARGET_TRIPLE: x86_64-unknown-linux-musl
          # Hashed file names, which the image serves as immutable.
          LEPTOS_HASH_FILES: "true"
        # The wasm and the server build in separate target directories, so they
        # run side by side instead of one after the other.
        run: |
          cargo leptos build --release --precompress --frontend-only &
          front=$!
          cargo leptos build --release --server-only --bin-features static-libpq &
          server=$!
          wait "$front"
          wait "$server"
          cp target/x86_64-unknown-linux-musl/release/marian marian
          # The wasm build writes the hashed file names beside the binary.
          cp target/x86_64-unknown-linux-musl/release/hash.txt hash.txt
          file marian | grep -Eq "statically linked|static-pie linked"
      - uses: actions/upload-artifact@v7
        with:
          name: marian
          path: |
            marian
            hash.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/site
          if-no-files-found: error

  release:
    name: Image and chart
    needs: [test, binary]
    runs-on: ubuntu-latest
    permissions:
      # Write, so a tag can publish its GitHub release.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: marian
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Image name
        id: image
        run: |
          chmod +x marian
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${image}:${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.image
          platforms: linux/amd64
          provenance: false
          sbom: false
          # GHCR serves this manifest as OCI. Runtimes that only ask for Docker
          # media types get MANIFEST_UNKNOWN, which kubelet reports as not found.
          outputs: type=image,push=true,oci-mediatypes=false
          build-args: MARIAN_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
      - uses: azure/setup-helm@v5
        if: startsWith(github.ref, 'refs/tags/')
      - name: Publish chart
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("deploy/marian/values.yaml")
          text = path.read_text()
          text = text.replace("repository: marian", f"repository: {os.environ['IMAGE']}", 1)
          # Whatever version values.yaml names, so a release needn't edit this file.
          text = re.sub(r'(?m)^(  tag: )".*"$', lambda m: f'{m.group(1)}"{os.environ["IMAGE_TAG"]}"', text, count=1)
          path.write_text(text)
          PY
          helm package deploy/marian --version "$version" --app-version "$version"
          owner="${GITHUB_REPOSITORY%%/*}"
          helm push "marian-${version}.tgz" "oci://ghcr.io/${owner,,}/charts"
      # The release the repository page lists, with the tag's commit description
      # (no subject, no Co-authored-by lines) as its notes and the binary and
      # chart attached.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp marian "marian-${version}-x86_64-linux-musl"
          git log -1 --format=%b "$GITHUB_SHA" | grep -iv '^co-authored-by:' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "marian-${version}-x86_64-linux-musl" "marian-${version}.tgz"
