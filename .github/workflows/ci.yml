name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  release:
    name: Image and chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GHCR serves this manifest as OCI. Runtimes that only ask for Docker
          # media types get MANIFEST_UNKNOWN, which kubelet reports as not found.
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
      - uses: azure/setup-helm@v4
      - name: Publish chart
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("deploy/marian/values.yaml")
          text = path.read_text()
          text = text.replace("repository: marian", f"repository: {os.environ['IMAGE']}", 1)
          text = text.replace('tag: "0.2.2"', f'tag: "{os.environ["IMAGE_TAG"]}"', 1)
          path.write_text(text)
          PY
          helm package deploy/marian --version "$version" --app-version "$version"
          owner="${GITHUB_REPOSITORY%%/*}"
          helm push "marian-${version}.tgz" "oci://ghcr.io/${owner,,}/charts"
