<div class="option" data-option>
  <div class="option-fields">
    <input type="hidden" name="opt{{ opt.n }}_id" value="{{ opt.id }}">
    <input name="opt{{ opt.n }}_emoji" value="{{ opt.emoji }}" aria-label="Emoji" maxlength="8">
    <input name="opt{{ opt.n }}_name" value="{{ opt.name }}" aria-label="Option name" maxlength="40" placeholder="Name">
    <input name="opt{{ opt.n }}_capacity" value="{{ opt.capacity }}" aria-label="Capacity" placeholder="No limit" inputmode="numeric">
    <select name="opt{{ opt.n }}_role" aria-label="Role limit">
      <option value="">Any role</option>
      {% for role in roles %}
      <option value="{{ role.id }}" {% if opt.role_id == role.id_s %}selected{% endif %}>{{ role.name }}</option>
      {% endfor %}
    </select>
    {% if not lock_options %}
    <button class="ghost option-remove" type="button">Remove</button>
    {% endif %}
  </div>
  <div class="checks">
    <label><input type="checkbox" name="opt{{ opt.n }}_waitlist" value="1" {% if opt.waitlist %}checked{% endif %}> <span>Waitlist</span></label>
    <label><input type="checkbox" name="opt{{ opt.n }}_reminders" value="1" {% if opt.reminders %}checked{% endif %}> <span>Reminders and attendee role</span></label>
  </div>
</div>
