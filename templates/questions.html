<div class="q-editor" data-q-editor>
  <p class="muted">A prompt and at least two choices. Leave a question blank to skip it.</p>
  {% for q in question_rows %}
  <div class="q-card" data-q-card {% if not q.visible %}hidden{% endif %}>
    <label class="field">Question
      <input name="{{ question_prefix }}_q{{ q.n }}_prompt" value="{{ q.prompt }}" placeholder="What are we doing?" maxlength="80">
    </label>
    <p class="q-kicker">Choices</p>
    <div class="q-choices" data-q-choices>
      {% for choice in q.choices %}
      <input name="{{ question_prefix }}_q{{ q.n }}_c{{ choice.n }}" value="{{ choice.value }}" placeholder="Choice" maxlength="40" aria-label="Choice" {% if not choice.visible %}hidden{% endif %}>
      {% endfor %}
    </div>
    <button type="button" class="ghost" data-add-choice>Add a choice</button>
  </div>
  {% endfor %}
  <button type="button" class="ghost" data-add-question>Add a question</button>
</div>
