<div class="rem-row" data-reminder>
  <input name="rem{{ rem.n }}_offset" value="{{ rem.offset }}" placeholder="minutes" inputmode="numeric" aria-label="Minutes before">
  <input name="rem{{ rem.n }}_message" value="{{ rem.message }}" placeholder="Optional note, such as flasks and food" aria-label="Reminder note">
  <button class="ghost reminder-remove" type="button">Remove</button>
</div>
