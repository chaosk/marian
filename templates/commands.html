{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Command desk</h1>
  </div>
</div>
<div class="split">
  <section class="cmd">
    <div class="log">
      {% for row in log %}
      <div>
        <p class="who">{{ row.user }}</p>
        <p>{{ row.line }}</p>
        <div class="reply md">{{ row.reply|md }}</div>
      </div>
      {% else %}
      <p>No commands yet.</p>
      {% endfor %}
    </div>
    <form method="post" action="{{ base }}/commands" style="margin-top:12px">
      <label class="field">Command
        <input id="command-line" name="line" placeholder="/event" required>
      </label>
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
  <section class="panel guide">
    <h3>Commands</h3>
    {% include "guide.html" %}
  </section>
</div>
{% endblock %}
