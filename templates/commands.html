{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Command desk</h1>
  </div>
</div>
<div class="split">
  <section class="cmd">
    <div class="log">
      {% for row in log %}
      <div>
        <p class="who">{{ row.user }}</p>
        <p>{{ row.line }}</p>
        <div class="reply md">{{ row.reply|md }}</div>
      </div>
      {% else %}
      <p>No commands yet. Try one of the examples.</p>
      {% endfor %}
    </div>
    <form method="post" action="{{ base }}/commands" style="margin-top:12px">
      <label class="field">Command
        <input id="command-line" name="line" placeholder="/event" required>
      </label>
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
  <section>
    <pre class="panel" style="white-space: pre-wrap">{{ help }}</pre>
    {% for example in examples %}
    <form method="post" action="{{ base }}/commands" style="margin-top:8px">
      <input type="hidden" name="line" value="{{ example }}">
      <button class="ghost" type="submit">{{ example }}</button>
    </form>
    {% endfor %}
  </section>
</div>
{% endblock %}
