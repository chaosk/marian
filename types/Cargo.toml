[package]
name = "marian-types"
version = "0.13.3"
edition = "2024"
description = "Shapes and wording Marian's server and browser share"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
diesel = { version = "2.4", default-features = false, features = ["postgres_backend"], optional = true }
serde = { version = "1", features = ["derive"] }

[features]
# Reads and writes the closed sets in `values` as Postgres TEXT, for the server.
diesel = ["dep:diesel"]

[dev-dependencies]
serde_json = { workspace = true }
