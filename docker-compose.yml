services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: marian
      POSTGRES_PASSWORD: marian
      POSTGRES_DB: marian
    ports:
      - "5432:5432"
    volumes:
      - marian-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marian -d marian"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marian-pg:
