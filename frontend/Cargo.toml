[package]
name = "marian-frontend"
version = "0.10.3"
edition = "2021"
description = "Hydrates Marian's dashboard in the browser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
leptos = { workspace = true, features = ["hydrate"] }
marian-app = { workspace = true, features = ["hydrate"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "Location", "Navigator", "Window"] }
