image:
  repository: marian
  tag: "0.11.1"
  pullPolicy: IfNotPresent

# Pods. Each serves the web; one at a time runs the bot, the tick and Discord
# jobs, chosen by a Postgres advisory lock, and another takes over within
# seconds when it stops. Above 1 the chart adds a PodDisruptionBudget that
# keeps one pod up through node drains.
replicaCount: 1

# RollingUpdate starts the new pod before stopping the old one, so the web
# stays up through upgrades; for a while both versions run against the
# migrated database. Recreate stops the old pod first, for a release whose
# migrations the previous version can't run against.
updateStrategy: RollingUpdate

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

discord:
  # Bot token. Required unless discord.existingSecret is set.
  token: ""
  # Use a secret you already created instead of discord.token.
  existingSecret: ""
  secretKey: token
  # Application id. Public. Used for the invite link and dashboard sign-in.
  clientId: ""
  # OAuth client secret. Empty leaves the dashboard on the landing page.
  # With existingSecret, leave this empty and set clientSecretKey instead.
  clientSecret: ""
  # Key in the Discord secret that holds the OAuth client secret.
  clientSecretKey: ""

# Google Calendar OAuth. Both empty leaves the connection off.
# In Google Cloud, the redirect URI is the public URL plus /auth/google/callback.
google:
  clientId: ""
  clientSecret: ""
  # Key in discord.existingSecret that holds the Google client secret.
  clientSecretKey: ""

database:
  # Postgres connection string. Required unless discord.existingSecret already
  # holds it under secretKey. Ignored when discord.existingSecret is set: the
  # pod then reads the string from that secret under secretKey.
  url: ""
  secretKey: databaseUrl
  # Pooled connections each pod keeps open. Each pod also holds two of its
  # own: one for the leader lock, one for live updates between pods.
  pool: 10

# Custom status under the bot's name. Empty leaves it unset.
status: ""

# OpenTelemetry traces. An empty endpoint leaves export off.
# The value is a base URL. Marian appends /v1/traces.
tracing:
  endpoint: ""
  serviceName: marian

# Full OTLP/HTTP URL for metrics, such as http://mimir:9009/otlp/v1/metrics.
# Empty leaves metrics off.
metrics:
  endpoint: ""

# Dashboard URL linked from Discord embeds. Empty is fine.
# When ingress is on and this is empty, the chart uses https://<ingress.host>.
publicUrl: ""

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  tls: false
  annotations: {}

# The old sqlite volume. The pod does not mount it. Off by default. A release
# that still has the claim deletes it, and the sqlite file on it, on the next
# upgrade unless this is set to true: copy the file out first.
persistence:
  enabled: false
  size: 1Gi
  # "-" selects the empty storage class. Empty uses the cluster default.
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
