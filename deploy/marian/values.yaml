# The reminder clock runs in this process. Keep this at 1.
replicaCount: 1

image:
  repository: marian
  tag: "0.8.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

discord:
  # Bot token. Required unless discord.existingSecret is set.
  token: ""
  # Use a secret you already created instead of discord.token.
  existingSecret: ""
  secretKey: token
  # Application id. Public. Used for the invite link and dashboard sign-in.
  clientId: ""
  # OAuth client secret. Empty leaves the dashboard on the landing page.
  # With existingSecret, leave this empty and set clientSecretKey instead.
  clientSecret: ""
  # Key in the Discord secret that holds the OAuth client secret.
  clientSecretKey: ""

# Google Calendar OAuth. Both empty leaves the connection off.
# In Google Cloud, the redirect URI is the public URL plus /auth/google/callback.
google:
  clientId: ""
  clientSecret: ""
  # Key in discord.existingSecret that holds the Google client secret.
  clientSecretKey: ""

database:
  # Postgres connection string. Required unless discord.existingSecret already
  # holds it under secretKey.
  url: ""
  secretKey: databaseUrl
  # Connections this process keeps open.
  pool: 10

# Custom status under the bot's name. Empty leaves it unset.
status: ""

# OpenTelemetry traces. An empty endpoint leaves export off.
# The value is a base URL. Marian appends /v1/traces.
tracing:
  endpoint: ""
  serviceName: marian

# Dashboard URL linked from Discord embeds. Empty is fine.
# When ingress is on and this is empty, the chart uses https://<ingress.host>.
publicUrl: ""

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  tls: false
  annotations: {}

# Unused by the pod. Leave this on through the first upgrade so Helm does not
# delete the old sqlite volume. Copy that file out, then set enabled to false.
persistence:
  enabled: true
  size: 1Gi
  # "-" selects the empty storage class. Empty uses the cluster default.
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
