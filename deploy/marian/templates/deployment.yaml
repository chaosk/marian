{{- if not (or .Values.discord.token .Values.discord.existingSecret) }}
{{- fail "Set discord.token or discord.existingSecret. Marian does not start without a bot token." }}
{{- end }}
{{- if and (not .Values.discord.existingSecret) (not .Values.database.url) }}
{{- fail "Set database.url to a Postgres connection string, or store it in discord.existingSecret under database.secretKey." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marian.fullname" . }}
  labels:
    {{- include "marian.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "marian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marian.labels" . | nindent 8 }}
      annotations:
        checksum/values: {{ printf "%v-%s-%s-%s-%v" .Values.discord.clientId (include "marian.publicUrl" .) .Values.status .Values.discord.clientSecretKey .Values.google.clientId | sha256sum }}
        {{- if and (not .Values.discord.existingSecret) .Values.discord.token }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marian
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "marian.secretName" . }}
                  key: {{ .Values.database.secretKey }}
            - name: MARIAN_DB_POOL
              value: {{ .Values.database.pool | default 10 | quote }}
            - name: MARIAN_PUBLIC_URL
              value: {{ include "marian.publicUrl" . | quote }}
            - name: MARIAN_STATUS
              value: {{ .Values.status | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ ((.Values.tracing).endpoint) | default "" | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ ((.Values.tracing).serviceName) | default "marian" | quote }}
            - name: DISCORD_CLIENT_ID
              value: {{ .Values.discord.clientId | quote }}
            {{ if and .Values.discord.existingSecret .Values.discord.clientSecretKey }}
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "marian.secretName" . }}
                  key: {{ .Values.discord.clientSecretKey }}
            {{ else if .Values.discord.clientSecret }}
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "marian.secretName" . }}
                  key: clientSecret
            {{ end }}
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "marian.secretName" . }}
                  key: {{ .Values.discord.secretKey }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.google.clientId | quote }}
            {{- if and .Values.discord.existingSecret .Values.google.clientSecretKey }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "marian.secretName" . }}
                  key: {{ .Values.google.clientSecretKey }}
            {{- else if .Values.google.clientSecret }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "marian.secretName" . }}
                  key: googleClientSecret
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
