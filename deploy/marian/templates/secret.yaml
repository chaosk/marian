{{- if and (not .Values.discord.existingSecret) .Values.discord.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marian.fullname" . }}
  labels:
    {{- include "marian.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.discord.secretKey }}: {{ .Values.discord.token | quote }}
  {{- if .Values.discord.clientSecret }}
  clientSecret: {{ .Values.discord.clientSecret | quote }}
  {{- end }}
  {{- if .Values.google.clientSecret }}
  googleClientSecret: {{ .Values.google.clientSecret | quote }}
  {{- end }}
{{- end }}
