[package]
name = "marian"
version = "0.6.1"
edition = "2021"
description = "Marian, the Discord scheduler"
license = "MIT"
publish = false

[features]
# Compiles libpq and OpenSSL into the binary. Release builds target musl.
static-libpq = ["dep:pq-sys", "pq-sys/bundled", "dep:openssl-sys", "openssl-sys/vendored"]

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
diesel = { version = "2.3.14", default-features = false, features = ["postgres", "r2d2", "32-column-tables", "serde_json", "chrono", "uuid"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["postgres"] }
minijinja = "2"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
openssl-sys = { version = "0.9.93", optional = true }
poise = "0.6"
pq-sys = { version = "0.7.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
