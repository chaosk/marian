[package]
name = "marian"
version = "0.8.0"
edition = "2021"
description = "Marian, the Discord scheduler"
license = "MIT"
publish = false

[workspace]
members = [".", "types", "app", "frontend", "server"]
resolver = "2"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
leptos = "0.8.22"
leptos-fetch = "0.4.10"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8.17"
marian = { path = "." }
marian-app = { path = "app" }
marian-types = { path = "types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[features]
# Compiles libpq and OpenSSL into the binary. Release builds target musl.
static-libpq = ["dep:pq-sys", "pq-sys/bundled", "dep:openssl-sys", "openssl-sys/vendored"]

[dependencies]
anyhow = "1"
axum = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
diesel = { version = "2.3.14", default-features = false, features = ["postgres", "r2d2", "32-column-tables", "serde_json", "chrono", "uuid"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["postgres"] }
marian-types = { workspace = true }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
openssl-sys = { version = "0.9.93", optional = true }
poise = "0.6"
pq-sys = { version = "0.7.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", features = ["trace", "testing"] }

# Line tables are enough for file and line in panics and backtraces, and full
# debug info for every dependency, host and wasm, is most of what fills target/.
[profile.dev]
split-debuginfo = "off"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "marian"
bin-package = "marian-server"
lib-package = "marian-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "app/style/main.css"
assets-dir = "app/public"
site-addr = "127.0.0.1:8080"
reload-port = 3001
browserquery = "defaults"
bin-exe-name = "marian"
bin-features = []
lib-features = []
lib-profile-release = "wasm-release"
# Release builds put each file's content hash in its name (LEPTOS_HASH_FILES=true
# in CI and the Dockerfile), so browsers keep them for good. Not set here:
# `cargo leptos watch` writes plain names but would still tell the server to use
# hashed ones, and the server would serve whatever an older build left behind.
